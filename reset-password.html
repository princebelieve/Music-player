<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Abanabame</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div id="app" class="app-shell">
    <main class="main-column" style="padding:48px; max-width:560px; margin:0 auto;">
      <header class="app-header" style="justify-content:center;">
        <div class="app-logo">🔐 Reset Password</div>
      </header>

      <section class="content-grid" style="padding:24px 0;">
        <div class="login-card" style="background:#1c1720; padding:28px; border-radius:24px; box-shadow:0 30px 70px rgba(0,0,0,.12);">
          <h2 style="margin-bottom:18px;">Reset your password</h2>
          <p id="resetMessage" style="margin-bottom:18px; color:#c3bfd0;">Enter your new password below.</p>
          <input type="password" id="resetPassword" placeholder="New password" style="margin-bottom:12px;" />
          <input type="password" id="resetConfirmPassword" placeholder="Confirm new password" style="margin-bottom:12px;" />
          <button class="btn btn-primary" id="resetSubmitBtn" onclick="window.submitResetPassword()">Update Password</button>
          <div id="resetStatus" style="margin-top:16px; font-size:0.95rem; color:#f5c88a;"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
