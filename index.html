<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎵 ABANABAME - Music Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e, #1a1f2e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .video-container {
            max-width: 800px;
            width: 100%;
            background: radial-gradient(circle at 20% 30%, #2a1f3a, #0d0b16);
            border-radius: 40px;
            padding: 30px 25px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
        }

        .song-title {
            text-align: center;
            color: #f5e56b;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #f5b81b, 0 0 60px #f5b81b55;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .sub-title {
            text-align: center;
            color: #cfc6a0;
            font-size: 1rem;
            letter-spacing: 6px;
            margin-bottom: 25px;
            opacity: 0.7;
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 100px;
            margin-bottom: 30px;
        }

        .bar {
            width: 12px;
            height: 20px;
            background: linear-gradient(to top, #f5d742, #f5a623);
            border-radius: 20px;
            animation: wave 0.8s infinite alternate ease-in-out;
            box-shadow: 0 0 15px #f5b81b88;
            transition: height 0.2s;
        }

        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        .bar:nth-child(6) { animation-delay: 0.5s; }
        .bar:nth-child(7) { animation-delay: 0.6s; }
        .bar:nth-child(8) { animation-delay: 0.7s; }
        .bar:nth-child(9) { animation-delay: 0.8s; }
        .bar:nth-child(10) { animation-delay: 0.9s; }

        @keyframes wave {
            0% { height: 20px; transform: scaleY(0.4); }
            100% { height: 90px; transform: scaleY(1); }
        }

        .lyric-box {
            background: rgba(10, 8, 20, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 30px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        #lyricDisplay {
            font-size: 1.8rem;
            line-height: 1.5;
            color: #f0e8d0;
            font-weight: 500;
            text-shadow: 0 0 30px #f5b81b33;
            transition: all 0.4s ease;
            word-break: break-word;
            max-width: 100%;
        }

        .highlight {
            color: #f5d742;
            font-weight: 700;
            text-shadow: 0 0 30px #f5b81b, 0 0 60px #f5b81b55;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .controls button {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #f5e56b;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            min-width: 120px;
        }

        .controls button:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #f5d742;
            transform: scale(1.04);
            box-shadow: 0 0 30px #f5b81b44;
        }

        .controls button:active {
            transform: scale(0.95);
        }

        #statusText {
            color: #a0987a;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 15px;
            text-align: center;
        }

        #audioPlayer {
            display: none;
        }

        @media (max-width: 600px) {
            .song-title { font-size: 1.8rem; }
            #lyricDisplay { font-size: 1.4rem; }
            .controls button { padding: 10px 18px; font-size: 1rem; min-width: 100px; }
        }
    </style>
</head>
<body>

<div class="video-container" id="app">
    <div class="song-title">🎤 ABANABAME</div>
    <div class="sub-title">✦ NA BONUS OO ✦</div>

    <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="lyric-box">
        <div id="lyricDisplay">🎶 <span class="highlight">Oseneblanabame…</span></div>
    </div>

    <div class="controls">
        <button id="playBtn">▶ PLAY</button>
        <button id="pauseBtn">⏸ PAUSE</button>
        <button id="resetBtn">⟳ RESET</button>
        <button id="fullscreenBtn">⛶ FULL</button>
    </div>
    <div id="statusText">⏹ paused • click PLAY to start</div>
</div>

<!-- Audio element -->
<audio id="audioPlayer" preload="auto"></audio>

<script>
    (function() {
        // ----- LYRICS TIMELINE (in seconds) -----
        const lyrics = [
            { time: 0, text: '🎵 Oseneblanabame…' },
            { time: 2.8, text: 'Abanabame…' },
            { time: 5.2, text: 'Oseneblanabame…' },
            { time: 8.0, text: '🎤 Oseneblanabame' },
            { time: 10.5, text: 'Nobi collect I come collect' },
            { time: 13.5, text: 'I come shout <span class="highlight">alleluia</span>' },
            { time: 16.0, text: 'Aba naba men' },
            { time: 18.5, text: 'Be ne san re gba ba hion' },
            { time: 21.0, text: 'Be ne Esan re gbabonelimi' },
            { time: 24.0, text: 'I come shout <span class="highlight">alleluia</span>' },
            { time: 26.5, text: 'To Aba naba me' },
            { time: 30.0, text: '✨ Anything You do for us today oh' },
            { time: 34.0, text: '<span class="highlight">Na bonus ooo</span>' },
            { time: 37.0, text: 'Anhan anhan ahan han' },
            { time: 39.5, text: '<span class="highlight">Na bonus oo</span>' },
            { time: 43.0, text: 'Baba me, I know say' },
            { time: 46.0, text: 'Even though we ask for nothing' },
            { time: 49.5, text: 'Say You go must do something when!' },
            { time: 52.5, text: 'Abanabame' },
            { time: 55.0, text: 'Because when praises go up' },
            { time: 58.0, text: 'Your blessings must come down' },
            { time: 61.0, text: 'So we come shout <span class="highlight">alleluia</span> when!' },
            { time: 64.0, text: 'Abanabame' },
            { time: 68.0, text: '✨ Anything You do for us today oh' },
            { time: 72.0, text: '<span class="highlight">Na bonus ooo</span>' },
            { time: 75.0, text: 'Anhan anhan ahan han' },
            { time: 77.5, text: '<span class="highlight">Na bonus oo</span>' },
            { time: 81.0, text: '🕊 Abanabame…' },
            { time: 85.0, text: 'Abanabame…' },
            { time: 88.5, text: '<span class="highlight">Alleluia…</span>' },
            { time: 92.0, text: '🎶 Anything You do for us today oh' },
            { time: 96.0, text: '<span class="highlight">Na bonus ooo</span>' },
            { time: 99.0, text: 'Anhan anhan ahan han' },
            { time: 101.5, text: '<span class="highlight">Na bonus oo!</span>' },
            { time: 104.0, text: 'Na bonus oo!' },
            { time: 108.0, text: 'Abanabame…' },
            { time: 112.0, text: 'Oseneblanabame…' },
            { time: 116.0, text: '<span class="highlight">Alleluia…</span> ✨' },
        ];

        // DOM elements
        const lyricDisplay = document.getElementById('lyricDisplay');
        const statusText = document.getElementById('statusText');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        // State
        let startTime = 0;
        let elapsed = 0;
        let timerId = null;
        let isPlaying = false;
        let audioLoaded = false;

        // ----- LOAD YOUR MP3 HERE (FIXED!) -----
        function loadAudio(filePath) {
            audioPlayer.src = filePath;
            audioPlayer.load();
            audioLoaded = true;
            console.log('✅ Audio loaded:', filePath);
        }

        // ----- THIS IS THE LINE YOU NEED - UNCOMMENTED WITH YOUR FILE -----
        loadAudio('abanabame2.mp3');

        // ----- Update lyric based on elapsed time -----
        function updateLyric(currentTime) {
            let found = lyrics[0];
            for (let i = lyrics.length - 1; i >= 0; i--) {
                if (currentTime >= lyrics[i].time) {
                    found = lyrics[i];
                    break;
                }
            }
            lyricDisplay.innerHTML = found.text;
        }

        // ----- Render loop -----
        function tick() {
            if (!isPlaying) return;

            const now = performance.now();
            const currentElapsed = (now - startTime) / 1000 + elapsed;
            updateLyric(currentElapsed);

            // Sync with audio if playing
            if (audioLoaded && !audioPlayer.paused && audioPlayer.currentTime > 0) {
                updateLyric(audioPlayer.currentTime);
            }

            const lastTime = lyrics[lyrics.length - 1].time;
            if (currentElapsed > lastTime + 5) {
                pausePlayback();
                statusText.textContent = '✅ FINISHED • click PLAY to restart';
                lyricDisplay.innerHTML = '🎶 <span class="highlight">Amen!</span> 🙌';
                if (audioLoaded) audioPlayer.pause();
                return;
            }

            statusText.textContent = `▶ playing • ${Math.floor(currentElapsed)}s`;

            // Visualizer animation
            document.querySelectorAll('.bar').forEach((bar, i) => {
                const h = 20 + 70 * (0.5 + 0.5 * Math.sin(currentElapsed * 2 + i * 1.2));
                bar.style.height = h + 'px';
            });

            timerId = requestAnimationFrame(tick);
        }

        // ----- Start playback -----
        function startPlayback() {
            if (isPlaying) return;
            
            if (elapsed > lyrics[lyrics.length - 1].time + 4) {
                elapsed = 0;
                updateLyric(0);
                if (audioLoaded) audioPlayer.currentTime = 0;
            }

            isPlaying = true;
            startTime = performance.now();
            
            // Play audio
            if (audioLoaded && audioPlayer.src) {
                audioPlayer.play()
                    .then(() => console.log('▶ Audio playing'))
                    .catch(e => {
                        console.error('❌ Audio play error:', e);
                        statusText.textContent = '⚠️ Error playing audio - check file';
                    });
            } else {
                console.warn('⚠️ No audio loaded');
            }
            
            statusText.textContent = '▶ playing...';
            tick();
        }

        // ----- Pause playback -----
        function pausePlayback() {
            if (!isPlaying) return;
            isPlaying = false;
            if (timerId) {
                cancelAnimationFrame(timerId);
                timerId = null;
            }
            const now = performance.now();
            elapsed = (now - startTime) / 1000 + elapsed;
            statusText.textContent = `⏸ paused at ${Math.floor(elapsed)}s`;
            updateLyric(elapsed);
            if (audioLoaded) audioPlayer.pause();
        }

        // ----- Reset -----
        function resetPlayback() {
            if (isPlaying) {
                isPlaying = false;
                if (timerId) {
                    cancelAnimationFrame(timerId);
                    timerId = null;
                }
            }
            elapsed = 0;
            startTime = 0;
            updateLyric(0);
            statusText.textContent = '⟳ reset • press PLAY';
            if (audioLoaded) {
                audioPlayer.currentTime = 0;
                audioPlayer.pause();
            }
            document.querySelectorAll('.bar').forEach(bar => {
                bar.style.height = '20px';
            });
        }

        // ----- Fullscreen -----
        function toggleFullscreen() {
            const container = document.querySelector('.video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // ----- Event listeners -----
        playBtn.addEventListener('click', startPlayback);
        pauseBtn.addEventListener('click', pausePlayback);
        resetBtn.addEventListener('click', resetPlayback);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (isPlaying) pausePlayback();
                else startPlayback();
            }
            if (e.key === 'r' || e.key === 'R') resetPlayback();
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // Init
        updateLyric(0);
        statusText.textContent = '⏹ paused • press PLAY or SPACE';
        
        console.log('🎵 ABANABAME Music Video Ready!');
        console.log('📁 Looking for: abanabame2.mp3');
        console.log('🎮 Controls: SPACE=play/pause, R=reset, F=fullscreen');
    })();
</script>

</body>
</html>
