<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abanabame · Silas Ibhadode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 5px;
        }

        /* Particle background */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .player-container {
            position: relative;
            z-index: 1;
            max-width: 750px;
            width: 100%;
            background: rgba(12, 15, 30, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 15px 20px;
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 200, 120, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 200, 120, 0.05);
        }

        /* ===== TOP SECTION: Vinyl + Title ===== */
        .top-section {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        /* Vinyl Record */
        .vinyl-wrapper {
            flex-shrink: 0;
        }

        .vinyl-record {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #0a0a0a);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 0 60px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: spinRecord 8s linear infinite;
            animation-play-state: paused;
            border: 3px solid #1a1a1a;
            flex-shrink: 0;
        }

        .vinyl-record::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #555, #111);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 30px rgba(255,200,100,0.15);
            border: 2px solid #333;
        }

        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #888, #222);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
        }

        .vinyl-record .grooves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 
                inset 0 0 0 15px rgba(255,255,255,0.02),
                inset 0 0 0 30px rgba(255,255,255,0.015),
                inset 0 0 0 45px rgba(255,255,255,0.01);
        }

        @keyframes spinRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        /* Title Block */
        .title-block {
            flex: 1;
        }

        .song-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7d9a0, #ffb87a, #f7d9a0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmerText 3s ease-in-out infinite;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        @keyframes shimmerText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .artist-name {
            font-size: 1.2rem;
            color: #b8a88a;
            letter-spacing: 4px;
            font-weight: 300;
            margin-top: 2px;
        }

        .bonus-badge {
            display: inline-block;
            margin-top: 5px;
            background: linear-gradient(135deg, rgba(255, 180, 70, 0.2), rgba(255, 200, 100, 0.05));
            padding: 3px 20px;
            border-radius: 50px;
            color: #f5c88a;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 200, 100, 0.15);
        }

        /* ===== PHOTO STRIP ===== */
        .photo-strip {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 25px;
            flex-wrap: wrap;
        }

        .photo-frame {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.6),
                0 0 0 3px rgba(255, 200, 120, 0.12);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: photoFloat 4s ease-in-out infinite alternate;
            position: relative;
            border: 2px solid rgba(255, 200, 120, 0.1);
        }

        .photo-frame:nth-child(1) { animation-delay: 0s; }
        .photo-frame:nth-child(2) { animation-delay: 0.6s; }
        .photo-frame:nth-child(3) { animation-delay: 1.2s; }
        .photo-frame:nth-child(4) { animation-delay: 0.3s; }
        .photo-frame:nth-child(5) { animation-delay: 0.9s; }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-frame:hover {
            transform: scale(1.12) translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 180, 80, 0.35);
            border-color: rgba(255, 200, 120, 0.3);
        }

        .photo-frame:hover img {
            transform: scale(1.08);
        }

        @keyframes photoFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }
        
        /* ===== MAIN PHOTO ===== */

        .main-photo {
           width: 100%;
           margin: 20px 0 25px;
           border-radius: 25px;
           overflow: hidden;
           box-shadow: 0 15px 40px rgba(0,0,0,0.6);
         border: 2px solid rgba(255,200,120,0.15);
       }

       .main-photo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* ===== LYRIC DISPLAY ===== */
        .lyric-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 25px;
            padding: 20px;
            margin: 10px 0 20px;
            min-height: 120px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 150, 0.06);
            box-shadow: inset 0 8px 25px rgba(0,0,0,0.5);
            scroll-behavior: smooth;
        }

        .lyric-box::-webkit-scrollbar {
            width: 3px;
        }
        .lyric-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .lyric-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f5b87e, #d4945a);
            border-radius: 10px;
        }

        #lyricsDisplay {
            font-size: 1.2rem;
            line-height: 2.2;
            color: #b0a090;
            text-align: center;
            font-weight: 400;
            min-height: 80px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 12px;
            padding: 5px;
        }

        .lyric-line {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            transition: all 0.4s ease;
            opacity: 0.35;
            font-size: 1rem;
        }

        .lyric-line-active {
            background: linear-gradient(90deg, rgba(255, 190, 100, 0.15), rgba(255, 190, 100, 0.05));
            color: #ffddb0;
            font-weight: 600;
            opacity: 1;
            transform: scale(1.08);
            text-shadow: 0 0 30px rgba(255, 180, 70, 0.15);
            font-size: 1.15rem;
            padding: 2px 16px;
        }

        /* ===== CUSTOM AUDIO CONTROLS ===== */
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 150, 0.06);
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f5b87e, #d4945a);
            color: #1a1a2a;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 180, 80, 0.25);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(255, 180, 80, 0.4);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.playing {
            background: linear-gradient(135deg, #ff6b6b, #e74c3c);
            box-shadow: 0 4px 15px rgba(255, 80, 80, 0.25);
        }

        .time-display {
            color: #8a7d6a;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1px;
            min-width: 80px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            outline: none;
            transition: height 0.2s;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #f5b87e, #d4945a);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 180, 80, 0.3);
            transition: transform 0.2s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #f5b87e, #d4945a);
            cursor: pointer;
            border: none;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .volume-icon {
            color: #8a7d6a;
            font-size: 1.1rem;
            opacity: 0.6;
        }

        .volume-slider {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5b87e;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5b87e;
            cursor: pointer;
            border: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 650px) {
            .player-container { padding: 20px; }
            .top-section { flex-direction: column; text-align: center; gap: 15px; }
            .song-title { font-size: 2.2rem; }
            .vinyl-record { width: 100px; height: 100px; }
            .photo-frame { width: 70px; height: 70px; }
            .photo-strip { gap: 10px; }
            #lyricsDisplay { font-size: 1rem; }
            .audio-controls { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .volume-control { width: 100%; justify-content: center; }
            .volume-slider { width: 100px; }
        }

        @media (max-width: 450px) {
            .photo-frame { width: 55px; height: 55px; }
            .play-btn { width: 42px; height: 42px; font-size: 1.1rem; }
            .time-display { font-size: 0.7rem; min-width: 60px; }
        }
        
        .main-photo img {
           animation: beatPhoto 0.8s infinite ease-in-out;
        }

@keyframes beatPhoto {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}
        
    </style>
</head>
<body>

<!-- Particle Canvas -->
<canvas id="particleCanvas"></canvas>

<div class="player-container">
    
    <!-- TOP: Vinyl + Title -->
    <div class="top-section">
        <div class="vinyl-wrapper">
            <div class="vinyl-record" id="vinylRecord">
                <div class="grooves"></div>
            </div>
        </div>
        <div class="title-block">
            <div class="song-title">ABANABAME</div>
            <div class="artist-name">Silas Ibhadode</div>
            <div class="bonus-badge">✦ na bonus oh ✦</div>
        </div>
    </div>

    <!-- MAIN PHOTO -->
<div class="main-photo">
    <img src="choir.png" alt="Silas Ibhadode and Choir">
</div>

    <!-- LYRICS -->
    <div class="lyric-box">
        <div id="lyricsDisplay"></div>
    </div>

    <!-- CUSTOM AUDIO CONTROLS -->
    <div class="audio-controls">
        <button class="play-btn" id="playBtn">▶</button>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
        <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer" preload="metadata" style="display:none;">
        <source src="abanabame2.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    // ============================================
    // 1. PARTICLES
    // ============================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0, mouseY = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.3 + 0.1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
                const force = (150 - dist) / 150 * 0.5;
                this.x -= dx * force * 0.02;
                this.y -= dy * force * 0.02;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 200, 150, ${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(255, 200, 150, ${0.05 * (1 - dist/120)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    // ============================================
    // 2. LYRIC ENGINE
    // ============================================
    const lyrics = [
        { time: 5.0, text: 'Honour The Son uhn' },
        { time: 14.0, text: 'Oseneblanabame…' },
        { time: 16.0, text: 'Abanabame…' },
        { time: 18.0, text: 'Abanabame' },
        { time: 20.0, text: 'Abanabame.' },
        { time: 22.0, text: 'Oseneblanabame…' },
        { time: 24.0, text: 'Abanabame…' },
        { time: 26.0, text: 'Abanabame' },
        { time: 29.0, text: 'Abanabame.' },
        { time: 31.0, text: 'Oseneblanabame' },
        { time: 33.0, text: 'Nobi collect I come collect' },
        { time: 35.0, text: 'I come shout alleluia' },
        { time: 37.0, text: 'Aba naba me' },
        { time: 39.0, text: 'Be ne san re gba ba hion' },
        { time: 41.0, text: 'Be ne Esan re gbabonelimi' },
        { time: 44.0, text: 'I come shout alleluia' },
        { time: 46.0, text: 'To Aba naba me' },
        { time: 49.0, text: 'Anything You do for us today oh' },
        { time: 53.0, text: 'Anhan anhan ahan han' },
        { time: 56.0, text: 'Na bonus ooo' },
        { time: 58.0, text: 'Anhan anhan ahan han' },
        { time: 63.0, text: 'Na bonus oo' },
        { time: 65.0, text: 'Baba me, I know say' },
        { time: 67.0, text: 'Even though we ask for nothing' },
        { time: 70.0, text: 'Say You go must do something when!' },
        { time: 72.0, text: 'Abanabame' },
        { time: 73.0, text: 'Because when praises go up' },
        { time: 76.0, text: 'Your blessings must come down' },
        { time: 78.0, text: 'So we come shout alleluia when!' },
        { time: 80.0, text: 'Abanabame' },
        { time: 83.0, text: 'Anything You do for us today oh' },
        { time: 87.0, text: 'Anhan anhan ahan han' },
        { time: 89.0, text: 'Na bonus ooo' },
        { time: 92.0, text: 'Anhan anhan ahan han' },
        { time: 98.0, text: 'Na bonus oo' },
        { time: 105.0, text: 'Oseneblanabame…' },
        { time: 107.0, text: 'Abanabame…' },
        { time: 109.0, text: 'Abanabame…' },
        { time: 111.0, text: 'Abanabame…' },
        { time: 113.0, text: 'Oseneblanabame…' },
        { time: 115.0, text: 'Abanabame…' },
        { time: 118.0, text: 'Abanabame…' },
        { time: 120.0, text: 'Alleluia…' },
        { time: 120.5, text: 'Alleluia…' },
        { time: 124.0, text: 'Anything You do for us today oh' },
        { time: 128.0, text: 'Anhan anhan ahan han' },
        { time: 130.0, text: 'Na bonus ooo' },
        { time: 133.0, text: 'Anhan anhan ahan han' },
        { time: 139.0, text: 'Na bonus oo' },
        { time: 141.0, text: 'Abanabame…' },
        { time: 144.0, text: 'Abanabame…' },
        { time: 145.0, text: 'Abanabame…' },
        { time: 148.0, text: 'Oseneblanabame…' },
        { time: 150.0, text: 'Abanabame…' },
        { time: 152.0, text: 'Abanabame…' },
        { time: 154.0, text: 'Alleluia…' },
    ];

    const audio = document.getElementById('audioPlayer');
    const lyricsDisplay = document.getElementById('lyricsDisplay');
    const vinylRecord = document.getElementById('vinylRecord');

    function renderLyrics(currentTime) {
        let activeIndex = -1;
        for (let i = 0; i < lyrics.length; i++) {
            if (lyrics[i].time <= currentTime) {
                activeIndex = i;
            } else {
                break;
            }
        }

        let html = '';
        for (let i = 0; i < lyrics.length; i++) {
            const isActive = (i === activeIndex);
            html += `<span class="lyric-line ${isActive ? 'lyric-line-active' : ''}">${lyrics[i].text}</span>`;
        }
        lyricsDisplay.innerHTML = html;

        if (activeIndex >= 0) {
            const activeEl = lyricsDisplay.querySelector('.lyric-line-active');
            if (activeEl) {
                activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }
    }

    renderLyrics(0);

    // ============================================
    // 3. CUSTOM AUDIO CONTROLS
    // ============================================
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const volumeSlider = document.getElementById('volumeSlider');

    // Load metadata to get duration
    audio.addEventListener('loadedmetadata', () => {
        updateTimeDisplay();
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateTimeDisplay() {
        const current = audio.currentTime || 0;
        const duration = audio.duration || 0;
        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        if (duration > 0) {
            progressBar.value = (current / duration) * 100;
        }
    }

    // Play/Pause
    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');
            vinylRecord.classList.add('playing');
        } else {
            audio.pause();
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
            vinylRecord.classList.remove('playing');
        }
    });

    // Progress bar
    progressBar.addEventListener('input', (e) => {
        const duration = audio.duration;
        if (duration > 0) {
            audio.currentTime = (e.target.value / 100) * duration;
        }
    });

    // Volume
    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value / 100;
    });

    // Audio events
    audio.addEventListener('timeupdate', () => {
        updateTimeDisplay();
        renderLyrics(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        vinylRecord.classList.remove('playing');
        progressBar.value = 0;
        updateTimeDisplay();
    });

    audio.addEventListener('play', () => {
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        vinylRecord.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        vinylRecord.classList.remove('playing');
    });

    // Initial update
    setTimeout(updateTimeDisplay, 100);

    console.log('🎵 Abanabame player ready!');
    console.log('📸 Replace photo URLs with your own images.');
    console.log('🎚️ Place abanabame2.mp3 in the same folder.');
</script>

</body>
</html>
