    * {

    body {

      gap: 25px;

    .vinyl-wrapper {

    .vinyl-record {
      width: 120px;
      height: 120px;
      border-radius: 50%;

      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(0, 0, 0, 0.8);
      position: relative;
      animation: spinRecord 8s linear infinite;
      animation-play-state: paused;
      border: 3px solid #1a1a1a;
      flex-shrink: 0;
    }

    .vinyl-record::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #555, #111);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 200, 100, 0.15);
      border: 2px solid #333;
    }

    .vinyl-record::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #888, #222);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .vinyl-record .grooves {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      height: 75%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 0 15px rgba(255, 255, 255, 0.02), inset 0 0 0 30px rgba(255, 255, 255, 0.015), inset 0 0 0 45px rgba(255, 255, 255, 0.01);
    }

    @keyframes spinRecord {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .vinyl-record.playing {
      animation-play-state: running;
    }

  <canvas id="particleCanvas"></canvas>

  <div class="player-container">

    <div class="top-section">

          <div class="grooves"></div>
        </div>

      <div class="title-block">

      </div>
    </div>

    </div>

    <div class="lyric-box">

    <div class="audio-controls">
      <button class="play-btn" id="playBtn">▶</button>

      </div>
    </div>

    <!-- DONATION SECTION -->
    <div class="donation-section">
      <h3 id="donationMessage">❤️ <span>Support Abanabame</span></h3>
      <div class="donation-amounts" id="donationAmounts">

        <button data-amount="5000">₦5000</button>

      <!-- ============================================ -->

        </button>

    <audio id="audioPlayer" preload="metadata" style="display:none;">

  <script>
    (function() {
      // ============================================
      // CONFIGURATION
      // ============================================
      const CONFIG = {
        backendUrl: 'https://abanabame-backend.onrender.com/api/donate',
        checkUnlockUrl: 'https://abanabame-backend.onrender.com/api/check-unlock',
        verifyPaymentUrl: 'https://abanabame-backend.onrender.com/api/verify-payment',
        appUrl: 'https://abanabame.globalcreest.com'
      };

      // ============================================
      // 1. PARTICLES (KEEP AS IS)
      // ============================================
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let mouseX = 0, mouseY = 0;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.3 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150) {
            const force = (150 - dist) / 150 * 0.5;
            this.x -= dx * force * 0.02;
            this.y -= dy * force * 0.02;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 200, 150, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(255, 200, 150, ${0.05 * (1 - dist/120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);

      // ============================================

      const progressBar = document.getElementById('progressBar');
      const timeDisplay = document.getElementById('timeDisplay');
      const volumeSlider = document.getElementById('volumeSlider');

      audio.addEventListener('loadedmetadata', () => { updateTimeDisplay(); });

      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      }

      function updateTimeDisplay() {
        const current = audio.currentTime || 0;
        const duration = audio.duration || 0;
        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        if (duration > 0) {
          progressBar.value = (current / duration) * 100;
        }
      }

        if (audio.paused) {
          audio.play();
          playBtn.textContent = '⏸';
          playBtn.classList.add('playing');
          vinylRecord.classList.add('playing');
        } else {
          audio.pause();
          playBtn.textContent = '▶';
          playBtn.classList.remove('playing');
          vinylRecord.classList.remove('playing');
        }
      });

      progressBar.addEventListener('input', (e) => {
        const duration = audio.duration;
        if (duration > 0) {
          audio.currentTime = (e.target.value / 100) * duration;
        }
      });

      volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value / 100;
      });

      audio.addEventListener('timeupdate', () => {
        updateTimeDisplay();
        renderLyrics(audio.currentTime);
      });

        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        vinylRecord.classList.remove('playing');
        progressBar.value = 0;
        updateTimeDisplay();

        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        vinylRecord.classList.add('playing');
      });

        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        vinylRecord.classList.remove('playing');

      const donateStatus = document.getElementById('donateStatus');
      const customAmountInput = document.getElementById('customAmount');
      const donorEmailInput = document.getElementById('donorEmail');
      const amountButtons = document.querySelectorAll('#donationAmounts button');

      let selectedAmount = 2000;
      let donationUnlocked = false;
      let currentEmail = '';

      // CHECK UNLOCK STATUS ON PAGE LOAD
      async function checkUnlockStatus() {
        const savedEmail = localStorage.getItem('abanabame_email');
        if (savedEmail) {
          donorEmailInput.value = savedEmail;
          currentEmail = savedEmail;
          
          try {
            const response = await fetch(CONFIG.checkUnlockUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: savedEmail })
            });
            
            const data = await response.json();
            
            if (data.unlocked) {
              donationUnlocked = true;
              document.getElementById('donationMessage').innerHTML = 
                '✅ <span>You have permanent access to Abanabame!</span>';
              document.getElementById('donateStatus').textContent = 
                '🎵 Thank you for your support! The full song is unlocked.';
              document.getElementById('donateStatus').style.color = '#4ade80';
              donateBtn.textContent = '✅ Already Unlocked';
              donateBtn.disabled = true;
              donateBtn.style.opacity = '0.6';
              
              if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                playBtn.classList.add('playing');
                vinylRecord.classList.add('playing');
              }
            }
          } catch (error) {
            console.log('Check unlock error:', error);
          }
        }
      }

      checkUnlockStatus();

      // DONATION AMOUNT SELECTION
      function setActiveButton(btn) {
        amountButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      amountButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          const val = this.dataset.amount;
          if (val === 'custom') {
            setActiveButton(this);
            customAmountInput.disabled = false;
            customAmountInput.focus();
            selectedAmount = parseInt(customAmountInput.value) || 2000;
          } else {
            setActiveButton(this);
            customAmountInput.disabled = true;
            selectedAmount = parseInt(val);
            customAmountInput.value = val;
          }
        });
      });

      customAmountInput.addEventListener('input', function() {
        const val = parseInt(this.value);
        if (!isNaN(val) && val > 0) {
          selectedAmount = val;
          amountButtons.forEach(b => b.classList.remove('active'));
          const customBtn = document.querySelector('#donationAmounts button[data-amount="custom"]');
          if (customBtn) customBtn.classList.add('active');
          customAmountInput.disabled = false;
        }
      });

      // DONATE BUTTON
      donateBtn.addEventListener('click', async function() {
        if (donationUnlocked) {
          donateStatus.textContent = '✅ You already have permanent access!';
          return;
        }

        const amount = selectedAmount;
        const email = donorEmailInput.value.trim();

        if (!amount || amount < 50) {
          donateStatus.textContent = '⚠️ Please enter a valid amount (min ₦50)';
          return;
        }

        if (!email || !email.includes('@')) {
          donateStatus.textContent = '⚠️ Please enter a valid email address';
          donorEmailInput.focus();
          return;
        }

        localStorage.setItem('abanabame_email', email);
        currentEmail = email;

        donateStatus.textContent = '⏳ Initiating payment...';
        donateBtn.disabled = true;

        try {
          const response = await fetch(CONFIG.backendUrl, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              amount: amount,
              email: email,
              callback_url: window.location.href.split('?')[0] + '?reference={{reference}}'
            })
          });

          const data = await response.json();

          if (data.success && data.authorization_url) {
            donateStatus.textContent = '🔄 Redirecting to Paystack...';
            window.location.href = data.authorization_url;
          } else {
            donateStatus.textContent = '❌ Error: ' + (data.error || 'Could not initiate payment');
            donateBtn.disabled = false;
          }

        } catch (err) {
          donateStatus.textContent = '❌ Network error. Please try again.';
          donateBtn.disabled = false;
          console.error('Donation error:', err);
        }
      });

      // VERIFY PAYMENT ON RETURN
      async function verifyPayment() {
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');

        if (reference) {
          try {
            const response = await fetch(CONFIG.verifyPaymentUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reference: reference })
            });
            
            const data = await response.json();
            
            if (data.verified) {
              donationUnlocked = true;
              localStorage.setItem('abanabame_email', data.email);
              document.getElementById('donationMessage').innerHTML = 
                '✅ <span>Permanent Access Unlocked!</span>';
              document.getElementById('donateStatus').textContent = 
                '🎉 Thank you! You now have permanent access to Abanabame.';
              document.getElementById('donateStatus').style.color = '#4ade80';
              donateBtn.textContent = '✅ Unlocked';
              donateBtn.disabled = true;
              donateBtn.style.opacity = '0.6';
              
              audio.play();
              playBtn.textContent = '⏸';
              playBtn.classList.add('playing');
              vinylRecord.classList.add('playing');
              
              window.history.replaceState({}, document.title, window.location.pathname);
            } else {
              donateStatus.textContent = '⚠️ Payment verification failed. Please contact support.';
            }
          } catch (error) {
            console.error('Verification error:', error);
            donateStatus.textContent = '❌ Error verifying payment. Please contact support.';
          }
        }
      }

      verifyPayment();

        if (audio.currentTime >= 30 && !donationUnlocked) {
          audio.pause();
          playBtn.textContent = '▶';
          playBtn.classList.remove('playing');
          vinylRecord.classList.remove('playing');

            '🎵 Donate once to unlock the full song forever!';

      // 5. SHARE FUNCTIONALITY
      // ============================================
      
      // Share on WhatsApp
      document.getElementById('shareWhatsAppBtn').addEventListener('click', function() {
        const message = encodeURIComponent(
          '🎵 Listen to "Abanabame" by Silas Ibhadode!\n' +
          'A soulful worship song that will bless your heart ❤️\n\n' +
          '🔗 Listen here: ' + CONFIG.appUrl + '\n\n' +
          'Support the ministry and unlock the full song forever! 🙏'
        );
        
        // Check if running in Capacitor
        if (window.Capacitor && window.Capacitor.isNative) {
          // Use Capacitor's share plugin if available
          if (window.Share) {
            window.Share.share({
              title: 'Abanabame by Silas Ibhadode',
              text: '🎵 Listen to Abanabame by Silas Ibhadode! Support the ministry ❤️',
              url: CONFIG.appUrl
            });
          } else {
            // Fallback for Capacitor without share plugin
            window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
          }
        } else {
          // Web fallback - try native share first
          if (navigator.share) {
            navigator.share({
              title: 'Abanabame by Silas Ibhadode',
              text: '🎵 Listen to Abanabame by Silas Ibhadode! Support the ministry ❤️',
              url: CONFIG.appUrl
            }).catch(err => {
              // If user cancels or share fails, fallback to WhatsApp
              if (err.name !== 'AbortError') {
                window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
              }
            });
          } else {
            // Direct WhatsApp link
            window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
          }
        }
      });

      // Copy Link
      document.getElementById('copyLinkBtn').addEventListener('click', function() {
        const url = CONFIG.appUrl;
        
        // Check if running in Capacitor with clipboard plugin
        if (window.Capacitor && window.Capacitor.isNative && window.Clipboard) {
          window.Clipboard.write({
            string: url

            const status = document.getElementById('donateStatus');
            status.textContent = '✅ Link copied to clipboard!';
            status.style.color = '#4ade80';
            setTimeout(() => {
              status.textContent = '💫 share the blessing with others';
              status.style.color = '#b8a88a';
            }, 3000);
          });
        } else {
          // Web clipboard API
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
              const status = document.getElementById('donateStatus');
              status.textContent = '✅ Link copied to clipboard!';
              status.style.color = '#4ade80';
              setTimeout(() => {
                status.textContent = '💫 share the blessing with others';
                status.style.color = '#b8a88a';
              }, 3000);
            }).catch(() => {
              // Fallback method
              copyLinkFallback(url);
            });
          } else {
            copyLinkFallback(url);
          }
        }
      });

      function copyLinkFallback(url) {
        // Create a temporary input element
        const tempInput = document.createElement('input');
        tempInput.value = url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        
        const status = document.getElementById('donateStatus');
        status.textContent = '✅ Link copied to clipboard!';
        status.style.color = '#4ade80';
        setTimeout(() => {
          status.textContent = '💫 share the blessing with others';
          status.style.color = '#b8a88a';
        }, 3000);
      }

      // ============================================
      // INITIAL SETUP
      // ============================================
      const defaultCustomBtn = document.querySelector('#donationAmounts button[data-amount="custom"]');

        setActiveButton(defaultCustomBtn);

        customAmountInput.value = 2000;

      console.log('🎵 Abanabame with Permanent Unlock!');
      console.log(`📍 App URL: ${CONFIG.appUrl}`);
      console.log(`📍 Backend URL: ${CONFIG.backendUrl}`);
      console.log('📱 Share on WhatsApp ready!');
      console.log('📋 Copy link ready!');
    })();
