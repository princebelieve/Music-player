<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Abanabame</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div id="app" class="app-shell">
    <main class="main-column" style="padding:48px; max-width:560px; margin:0 auto;">
      <header class="app-header" style="justify-content:center;">
        <div class="app-logo">🔐 Forgot Password</div>
      </header>
      <section class="content-grid" style="padding:24px 0;">
        <div class="login-card" style="background:#1c1720; padding:28px; border-radius:24px; box-shadow:0 30px 70px rgba(0,0,0,.12);">
          <h2 style="margin-bottom:18px;">Request a password reset</h2>
          <p id="forgotMessage" style="margin-bottom:18px; color:#c3bfd0;">Enter the email address for your account and we will send a reset link.</p>
          <input type="email" id="forgotEmail" placeholder="Email address" style="margin-bottom:12px;" />
          <button class="btn btn-primary" id="forgotSubmitBtn" onclick="window.submitForgotPassword()">Send reset link</button>
          <div id="forgotStatus" style="margin-top:16px; font-size:0.95rem; color:#f5c88a;"></div>
          <div style="margin-top:18px; font-size:0.9rem; color:#c3bfd0;">
            <a href="index.html" style="color:#f5b87e;">Back to sign in</a>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
